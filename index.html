<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="description" content="Kotoba — apprends le vocabulaire japonais avec les kanji, les furigana, le romaji et des phrases de contexte. Révision espacée, import libre et OCR.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Kotoba — mes mots japonais</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>

<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="#apprendre" aria-label="Kotoba, retour à l'accueil">
      <span class="brand-mark" aria-hidden="true">言</span>
      <span class="brand-text">Kotoba<small>japonais au quotidien</small></span>
    </a>
    <nav class="desktop-nav" aria-label="Navigation principale">
      <a href="#apprendre" data-nav="learn">Apprendre</a>
      <a href="#reviser" data-nav="review">Réviser <span class="nav-badge" id="dueBadge">0</span></a>
      <a href="#mots" data-nav="library">Mes mots</a>
      <a href="#importer" data-nav="import">Importer</a>
    </nav>
    <div class="header-stats">
      <span class="stat-pill streak" title="Série de jours"><span aria-hidden="true">🔥</span><b id="streakVal">0</b></span>
      <span class="stat-pill xp" title="XP aujourd'hui"><span aria-hidden="true">⚡</span><b id="xpVal">0</b></span>
      <button class="icon-btn" id="settingsBtn" type="button" data-action="open-settings" aria-label="Ouvrir les réglages">⚙</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="view" id="view-learn" aria-label="Apprendre"></section>
  <section class="view" id="view-review" aria-label="Réviser" hidden></section>
  <section class="view" id="view-library" aria-label="Mes mots" hidden></section>
  <section class="view" id="view-import" aria-label="Importer" hidden></section>
</main>

<nav class="bottom-nav" aria-label="Navigation mobile">
  <a href="#apprendre" data-nav="learn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg>
    <span>Apprendre</span>
  </a>
  <a href="#reviser" data-nav="review">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    <span>Réviser</span>
  </a>
  <a href="#mots" data-nav="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Mes mots</span>
  </a>
  <a href="#importer" data-nav="import">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
    <span>Importer</span>
  </a>
</nav>

<div id="session" class="session" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript>
  <p class="noscript">Kotoba a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur, puis recharge la page.</p>
</noscript>

<script src="data.js"></script>
<script src="js/lexicon.js"></script>
<script src="js/srs.js"></script>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>

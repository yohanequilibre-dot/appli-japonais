<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Kotoba — apprends et révise les mots japonais : kanji, furigana, romaji, traduction et phrase de contexte.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇯🇵</text></svg>">
<title>Kotoba — mes mots japonais</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="logo">ことば<span>Kotoba</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="learn">Apprendre</button>
      <button class="tab" data-view="review">Réviser <span class="badge" id="dueBadge" hidden>0</span></button>
      <button class="tab" data-view="all">Mots</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-learn"></section>
  <section class="view" id="view-review" hidden></section>
  <section class="view" id="view-all" hidden></section>

  <section class="view" id="view-session" hidden>
    <div id="sessionBox">
      <div class="s-top">
        <button class="x" id="quitBtn" aria-label="Quitter">✕</button>
        <div class="progress"><div class="fill" id="sFill"></div></div>
        <div class="s-count" id="sCount">0/0</div>
      </div>
      <div class="card" id="card">
        <div class="card-main">
          <div class="tag" id="cTag"></div>
          <div class="jp" id="cJp"></div>
          <div class="romaji" id="cRomaji"></div>
          <div class="fr" id="cFr"></div>
          <button class="speak" id="speakW">🔊 Écouter</button>
        </div>
        <aside class="card-side" id="cardSide">
          <div class="side-label">En contexte</div>
          <div class="ex-jp" id="cEx"></div>
          <div class="ex-fr" id="cExFr"></div>
          <button class="speak small" id="speakS">🔊 La phrase</button>
        </aside>
      </div>
      <p class="hint" id="hint">Prononce le mot à voix haute, puis valide.</p>
      <div class="actions" id="sActions">
        <button class="btn ghost" id="againBtn">Je ne savais pas</button>
        <button class="btn primary" id="okBtn">J'ai prononcé ✓</button>
      </div>
    </div>
    <div class="summary" id="summary" hidden></div>
  </section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

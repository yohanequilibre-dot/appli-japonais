name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JavaScript
        run: |
          set -e
          for f in data.js sw.js js/*.js tests/*.js playwright.config.js; do
            if [ -f "$f" ]; then
              echo "check $f"
              node --check "$f"
            fi
          done
      - name: Manifeste
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Tests unitaires
        run: node tests/unit.js
  e2e:
    runs-on: ubuntu-latest
    needs: syntax-and-unit
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: npx playwright test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

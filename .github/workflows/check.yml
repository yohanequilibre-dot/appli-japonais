name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntaxe JavaScript
        run: |
          set -e
          for f in app.js data.js js/*.js tests/*.js; do
            if [ -f "$f" ]; then
              echo "check $f"
              node --check "$f"
            fi
          done
      - name: Tests unitaires
        run: node tests/unit.js

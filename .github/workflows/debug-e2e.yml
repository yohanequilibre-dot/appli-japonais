name: debug-e2e
on:
  push:
    paths:
      - .github/workflows/debug-e2e.yml
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer
        run: npm install && npx playwright install --with-deps chromium
      - name: Diagnostiquer
        run: |
          cat > tests/debug.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');
          test('debug chargement', async ({ page }) => {
            const events = [];
            page.on('pageerror', (e) => { events.push(e.message); console.log('PAGEERROR', e.message); });
            page.on('console', (m) => console.log('CONSOLE', m.type(), m.text()));
            page.on('requestfailed', (r) => console.log('REQFAIL', r.url(), r.failure().errorText));
            const res = await page.goto('/');
            console.log('STATUS', res.status());
            await page.waitForTimeout(1500);
            console.log('CTA', await page.getByTestId('cta-main').count());
            console.log('SETTINGS', await page.locator('#settingsBtn').count());
            console.log('BODY', (await page.locator('body').innerText()).slice(0, 800).replace(/\n/g, ' | '));
            console.log('ERRORS', JSON.stringify(events));
            expect(true).toBe(true);
          });
          EOF
          npx playwright test tests/debug.spec.js --reporter=line > debug-output.txt 2>&1 || true
      - name: Publier le journal
        run: |
          git config user.name 'kotoba-bot'
          git config user.email 'kotoba-bot@users.noreply.github.com'
          git add debug-output.txt
          git diff --cached --quiet || git commit -m 'debug: journal de chargement de l application'
          git push

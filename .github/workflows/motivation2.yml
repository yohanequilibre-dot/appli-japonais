name: motivation
on:
  push:
    paths:
      - .github/workflows/motivation2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer
        run: |
          node .github/motivation-patch.js
          git config user.name 'kotoba-bot'
          git config user.email 'kotoba-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: ajouter la serie, le defi quotidien et les celebrations'
          git rm .github/workflows/motivation.yml .github/workflows/motivation2.yml .github/motivation-patch.js
          git commit -m 'chore: retirer les fichiers de mise en place'
          git push

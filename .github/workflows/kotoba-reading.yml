name: Kotoba lectures et prononciation
on:
  push:
    branches: [main]
    paths:
      - '.github/kotoba-reading-patch.js'
      - '.github/workflows/kotoba-reading.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Appliquer le patch
        run: node .github/kotoba-reading-patch.js
      - name: Commit et push
        run: |
          git config user.name 'kotoba-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: prononciation guidée et furigana des phrases'
          git push

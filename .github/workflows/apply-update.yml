name: apply-update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-update.yml
      - scripts/apply-update.py
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Appliquer les modifications
        run: python3 scripts/apply-update.py
      - name: Vérifier la syntaxe et les tests unitaires
        run: |
          set -e
          for f in data.js sw.js js/*.js tests/*.js playwright.config.js; do
            if [ -f $f ]; then echo check $f; node --check $f; fi
          done
          node tests/unit.js
      - name: Publier
        run: |
          if git diff --quiet; then echo 'Aucune modification.'; exit 0; fi
          git config user.name 'kotoba-bot'
          git config user.email 'kotoba-bot@users.noreply.github.com'
          git add -A
          git commit -m 'feat: grammaire, vocabulaire quotidien et suivi des révisions'
          git rm .github/workflows/apply-update.yml scripts/apply-update.py
          git commit -m 'chore: retirer le workflow temporaire'
          git push
